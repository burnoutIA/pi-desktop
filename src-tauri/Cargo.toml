[package]
name = "pi-desktop"
version = "0.1.0"
description = "Surcouche vocale pour pi coding agent"
edition = "2021"

[lib]
name = "pi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.18.2"
futures-util = "0.3.34"
ignore = "0.4.33"
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9.0"
rmp-serde = "1.3.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
